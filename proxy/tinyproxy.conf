# tinyproxy config for the egress-allowlist sidecar (docker-compose.yml).
# Only domains matching a line in ./filter are reachable; everything else 403s.
#
# NOT an open relay:
#   - Listen only on the internal-network IP (172.31.9.3, pinned in compose),
#     never on the egress interface — so nothing on the route-out side can
#     reach the proxy port at all.
#   - Allow only the app's internal IP (172.31.9.2). Any other container, even
#     one attached to the internal network, is refused before filtering.
# Both IPs are the static addresses assigned in docker-compose.yml; keep the
# three in sync if you renumber the `internal` subnet.
#
# FilterType fnmatch matches against the PARSED HOST, not the full URL string
# (verified against tinyproxy 1.11.3): userinfo tricks (allowed@evil) and
# path tricks (evil/allowed) are extracted away and denied.
Port 8888
Listen 172.31.9.3
Allow 172.31.9.2
Timeout 600
MaxClients 32
FilterType fnmatch
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
