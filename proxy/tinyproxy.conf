# tinyproxy config for the optional egress-allowlist sidecar (docker-compose.yml).
# Only domains matching a line in ./filter are reachable; everything else 403s.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 32
Allow 0.0.0.0/0
FilterType fnmatch
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
