# Production compose — hardened per HARDENING.md §6.
# Build/run: docker compose build && docker compose up
# The base-image digest comes from .env (NODE_IMAGE=…), auto-loaded by compose.
# Secrets come from ~/.config/<this-directory-name>/env — same file ./dev/run
# uses; missing is tolerated (required: false).

services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:?NODE_IMAGE missing — is the .env pin file present?}
    init: true   # PID 1 that forwards signals — bare `node` as PID 1 ignores
                 # SIGTERM, so `docker compose stop` hangs 10s then SIGKILLs
    env_file:
      - path: ${HOME}/.config/${COMPOSE_PROJECT_NAME}/env
        required: false
    environment:
      PORT: "3000"   # pinned to match the mapping below; a PORT in the
                     # env_file would move the app off the published port.
                     # Authority: DEFAULT_PORT in src/index.ts — if you move
                     # the port there, update this value and the mapping below.
    ports:
      # Bound to loopback (127.0.0.1) by default so the secrets-holding process
      # is not reachable from the LAN; set BIND_ADDR=0.0.0.0 to expose it (see
      # HARDENING.md). Container side derives from DEFAULT_PORT (src/index.ts).
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    # --- hardening: the app gets a read-only world and no privileges -------
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    # To force all egress through the proxy sidecar below, put `app` on the
    # networks here (uncomment) and teach it to honor https_proxy: either set
    # NODE_USE_ENV_PROXY=1 (zero code, covers global fetch) or use undici's
    # EnvHttpProxyAgent as global dispatcher (covers SDKs too).
    # NOTE: `internal: true` networks do not publish ports — on internal
    # alone, the `ports:` mapping above silently stops working. The `ingress`
    # network below exists to keep the published port alive without handing
    # the app a direct route out (no NAT masquerade = inbound only).
    # networks: [internal, ingress]
    # (add to the `environment:` block above:)
    #   NODE_USE_ENV_PROXY: 1
    #   https_proxy: http://proxy:8888
    #   http_proxy: http://proxy:8888

# --- optional egress-allowlist sidecar (OFF by default) ----------------------
# Enable when this project holds secrets worth guarding: uncomment the proxy
# service and the networks block, plus the app's `networks`/`environment`
# lines above. `internal: true` means the app has NO direct route out — the
# tinyproxy allowlist becomes the only door (HARDENING.md §2).
#
#   proxy:
#     image: kalaksi/tinyproxy:latest   # pin a digest before relying on it
#     networks: [internal, egress]
#     read_only: true
#     tmpfs: [/tmp]
#     cap_drop: [ALL]
#     security_opt: [no-new-privileges:true]
#     pids_limit: 64
#     mem_limit: 128m
#     restart: unless-stopped
#     volumes:
#       - ./proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
#       - ./proxy/filter:/etc/tinyproxy/filter:ro
#     healthcheck:
#       # Plain TCP probe. An HTTP GET straight at tinyproxy earns a 400 (it
#       # only speaks proxy requests) and busybox wget resolves localhost to
#       # ::1 while tinyproxy listens on IPv4 — either way: forever-unhealthy.
#       test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 8888"]
#       interval: 30s
#       timeout: 5s
#       retries: 3
#
# The proxy config ships in ./proxy/ — edit proxy/filter (one domain glob per
# line) to allowlist only what the app truly needs.
#
# networks:
#   internal:
#     internal: true   # no direct egress for anything on this network
#   egress: {}         # the proxy's route out
#   ingress:           # app's published port keeps working here: DNAT for
#     driver_opts:     # inbound is unaffected, but with masquerade off the
#       com.docker.network.bridge.enable_ip_masquerade: "false"   # app's own outbound packets leave un-NATed and die at the router
